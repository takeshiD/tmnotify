[package]
name = "tmnotify"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/takeshiD/tmnotify"
description = "A tmux notification center built around floating panes"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
getrandom = "0.4"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
signal-hook = "0.3"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync"] }
toml = "0.9"
unicode-width = "0.2.1"
unicode-segmentation = "1.12"
uuid = { version = "1.18", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"
