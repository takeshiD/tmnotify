[package]
name = "tmnotify"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/takeshiD/tmnotify"
description = "A tmux notification center built around floating panes"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-width = "0.2.1"
uuid = { version = "1.18", features = ["serde", "v7"] }
