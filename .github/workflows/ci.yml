name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install MSRV
        run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked --all-targets

  macos:
    name: macOS unit and build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release

  tmux-pinned:
    name: Isolated pinned tmux compatibility
    runs-on: ubuntu-24.04
    env:
      # floating_panes was the immutable upstream surface used by Issue #4.
      TMUX_COMMIT: 4a91d5601e174ecd19ffd4f5959ee94366bee410
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tmux build dependencies
        run: sudo apt-get update && sudo apt-get install -y automake bison build-essential libevent-dev libncurses-dev pkg-config util-linux
      - name: Build pinned tmux
        run: |
          git clone --filter=blob:none https://github.com/tmux/tmux.git "$RUNNER_TEMP/tmux"
          git -C "$RUNNER_TEMP/tmux" checkout --detach "$TMUX_COMMIT"
          cd "$RUNNER_TEMP/tmux"
          sh autogen.sh
          ./configure --prefix="$RUNNER_TEMP/tmux-install"
          make -j2 install
      - name: Probe only an isolated tmux server
        run: scripts/test-tmux-capabilities.sh "$RUNNER_TEMP/tmux-install/bin/tmux"
      - name: Run deterministic tmux module tests
        run: |
          cargo test --locked tmux::capability
          cargo test --locked tmux::control
          cargo test --locked tmux::topology
      - name: Run isolated ProductionBackend integration tests
        run: |
          PATH="$RUNNER_TEMP/tmux-install/bin:$PATH" \
            cargo test --locked tmux::production::tests::isolated_ -- --ignored
