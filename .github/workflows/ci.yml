name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Trace section 24 acceptance checks
        run: scripts/check-acceptance-trace.sh
      - name: Enforce the local-only product boundary
        run: scripts/check-no-network.sh

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install MSRV
        run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked --all-targets

  macos:
    name: macOS unit and build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Trace section 24 acceptance checks
        run: scripts/check-acceptance-trace.sh
      - name: Smoke-test the release command surface
        run: scripts/smoke-release.sh target/release/tmnotify

  tmux-pinned:
    name: Isolated pinned tmux compatibility
    runs-on: ubuntu-24.04
    env:
      # Immutable next-3.8 surface including floating and modal panes.
      TMUX_COMMIT: d44bfda26d2468b5f474087b56f93eda34c541b6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tmux build dependencies
        run: sudo apt-get update && sudo apt-get install -y automake bison build-essential libevent-dev libncurses-dev pkg-config util-linux
      - name: Build pinned tmux
        run: |
          git clone --filter=blob:none https://github.com/tmux/tmux.git "$RUNNER_TEMP/tmux"
          git -C "$RUNNER_TEMP/tmux" checkout --detach "$TMUX_COMMIT"
          cd "$RUNNER_TEMP/tmux"
          sh autogen.sh
          ./configure --prefix="$RUNNER_TEMP/tmux-install"
          make -j2 install
      - name: Exercise isolated tmux capabilities and lifecycle
        env:
          TMNOTIFY_TMUX_ARTIFACT_DIR: ${{ runner.temp }}/tmux-acceptance
        run: scripts/test-tmux-capabilities.sh "$RUNNER_TEMP/tmux-install/bin/tmux"
      - name: Verify tmux-facing product policy
        run: |
          cargo test --locked tmux::capability
          cargo test --locked tmux::control
          cargo test --locked tmux::topology
          cargo test --locked daemon::reconcile::tests
          cargo test --locked toast::tests::order_capacity_and_waiting_are_per_window
          cargo test --locked toast::tests::animation_batches_windows_and_drops_quantized_duplicates
          cargo test --locked daemon::tests::attention_is_global_and_queued_by_priority_fifo
      - name: Run isolated ProductionBackend integration tests
        run: |
          PATH="$RUNNER_TEMP/tmux-install/bin:$PATH" \
            cargo test --locked tmux::production::tests::isolated_ -- --ignored
      - name: Upload isolated tmux diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmux-pinned-acceptance
          path: ${{ runner.temp }}/tmux-acceptance
          if-no-files-found: error
          retention-days: 7
